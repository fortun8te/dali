name: Build and compatibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension regression tests
        run: node --test --test-reporter=spec chrome-extension/tools/harness/regressions.mjs
      - name: Production C engine regression tests
        run: node scripts/tests/airplay-backpressure.mjs
      - name: Bundled engine source and patch hashes
        run: python3 scripts/engine-source-provenance.py
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project generator
        run: brew install xcodegen
      - name: Complete V2 validation gate
        run: bash scripts/check.sh
